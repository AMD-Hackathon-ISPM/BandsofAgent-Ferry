services:
  postgres:
    image: postgres:15-alpine
    container_name: ferry-postgres
    environment:
      POSTGRES_DB: ferry
      POSTGRES_USER: ferry
      POSTGRES_PASSWORD: ferry_dev_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ferry"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ferry-network

  redis:
    image: redis:7-alpine
    container_name: ferry-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ferry-network

  minio:
    image: minio/minio:latest
    container_name: ferry-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ferry
      MINIO_ROOT_PASSWORD: ferry_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - ferry-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ferry-backend
    environment:
      PORT: 8080
      ENV: development

      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ferry
      DB_USER: ferry
      DB_PASSWORD: ferry_dev_password
      DB_SSL_MODE: disable

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0

      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ferry
      MINIO_SECRET_KEY: ferry_dev_password
      MINIO_USE_SSL: "false"
      MINIO_BUCKET_SOURCE: ferry-source-files
      MINIO_BUCKET_ARTIFACTS: ferry-artifacts
      MINIO_BUCKET_REPORTS: ferry-reports

      JWT_SECRET: dev_jwt_secret_change_in_production
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 168h

      BAND_PROVIDER: stub
      BAND_BASE_URL: https://api.band.dev/v1
      BAND_API_KEY: ""

      IBM_MODEL_ENDPOINT: ""
      IBM_MODEL_API_KEY: ""
      IBM_MODEL_ID: ""

      GITHUB_PAT: ""
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - ferry-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ferry-frontend-tui
    environment:
      FERRY_REPO_ROOT: /workspace
      FERRY_BACKEND_DIR: /workspace/backend
      FERRY_BACKEND_URL: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    stdin_open: true
    tty: true
    profiles:
      - tui
    networks:
      - ferry-network

  nginx:
    image: nginx:alpine
    container_name: ferry-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./backend/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - ferry-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  ferry-network:
    driver: bridge
