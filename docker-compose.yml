services:
  postgres:
    image: postgres:18.4-alpine3.23
    container_name: ferry-postgres
    environment:
      POSTGRES_DB: ferry
      POSTGRES_USER: ferry
      POSTGRES_PASSWORD: ferry_dev_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ferry"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ferry-network

  redis:
    image: redis:8.8.0-alpine
    container_name: ferry-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ferry-network

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    container_name: ferry-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ferry
      MINIO_ROOT_PASSWORD: ferry_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - ferry-network

  migrate:
    image: migrate/migrate:latest
    container_name: ferry-migrate
    command:
      - "-path=/migrations"
      - "-database=postgres://ferry:ferry_dev_password@postgres:5432/ferry?sslmode=disable"
      - "up"
    volumes:
      - ./backend/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ferry-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ferry-backend
    env_file:
      - ./backend/.env
    environment:
      # Override localhost-only values with Docker service names
      DB_HOST: postgres
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio:9000
      FRONTEND_URL: http://localhost
      GITHUB_REDIRECT_URI: http://localhost/auth/github/callback
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ferry-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost
    container_name: ferry-frontend
    networks:
      - ferry-network
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine3.23-perl
    container_name: ferry-nginx
    ports:
      - "80:80"
    volumes:
      - ./backend/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - ferry-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  ferry-network:
    driver: bridge
